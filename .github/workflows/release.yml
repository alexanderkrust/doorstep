# Release on a version tag (`v1.2.3`, matching `version` in package.json):
# checks as in CI, smoke test, vulnerability scan, then the image goes to the GitHub
# Container Registry with SBOM and provenance attestations and a keyless cosign signature,
# and a GitHub release is created with the section of CHANGELOG.md.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Build, verify and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # GitHub release
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches package.json and CHANGELOG.md
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match version $pkg in package.json"
            exit 1
          fi
          if ! grep -q "^## \[$tag\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## [$tag]'"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Install osmium-tool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends osmium-tool
      - run: npm ci --no-audit --no-fund
      - run: npm run ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image for the checks
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: doorstep:release
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: npm run smoke
        env:
          IMAGE: doorstep:release
          SKIP_BUILD: '1'
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: doorstep:release
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # 1.2.3, 1.2 and 1; no `latest`, so that a deployment always names a version.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image with SBOM and provenance
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image (keyless, GitHub OIDC)
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Create GitHub release
        run: |
          version="${{ steps.version.outputs.version }}"
          # The section of this version, without its heading, up to the next one.
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          {
            echo
            echo "Image: \`${IMAGE}:${version}@${DIGEST}\`"
          } >> release-notes.md
          prerelease=()
          case "$version" in 0.* | *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md "${prerelease[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
